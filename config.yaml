# logo图片名称，需要上传至img目录
logo: "logo-xchat.png"

# 版本号
version: "Beta"

# 界面图标emoji
main_screen_icon: "chat"

# 选择模型类型(大小写均可)，支持"GLM"和"QWEN"，配置"FAKE"可用于测试
model: "glm"

# 界面标题
header: "双向认知功能演示"

# title为每个markdown框标题
# type分为stream和normal，即流式回答与非流式回答
# 占位符：{question} 表示用户输入的问题，{result1} 表示系统第一次回复的答案，{result2} 表示系统第二次回复的答案...
prompt_config:
  PROMPT_TEMPLATE_1:
    title: "场景理解"
    type: "stream"
    prompt:
      '
      你是一个军事仿真推演系统算子设计开发的专家，你对军事算子的业务执行流程和代码编写规范非常熟悉，现在我给你提供一段节选自其他军事仿真推演系统的代码片段，需要你结合通识和军事专业知识对这段代码进行阅读理解，分析这段代码中的哪些内容描述了哪个或哪些军事算子？逐个分析这些算子适用于哪个或哪些军事业务场景？最终用中文将结果总结输出即可，要求输出内容不超过50字，不要复述问题，不要有任何多余内容的回复。
      以下是给你提供的代码片段：{question}
      '

  PROMPT_TEMPLATE_2:
    title: "注释生成"
    type: "stream"
    prompt:
      '
      你是一个军事仿真推演系统算子设计开发的专家，你对军事算子的业务执行流程和代码编写规范非常熟悉，现在我给你提供一段节选自其他军事仿真推演系统的代码片段和其对应适用的业务场景，需要你在原代码基础上，对其中涉及业务流程和判断逻辑的内容进行注释，注释的格式为“简要的综述，加较为详细的解释描述”，请你输出完整的带有注释的代码，不要复述问题，不要有任何多余内容的回复。
      场景：{result1}
      代码：{question}
      '

  PROMPT_TEMPLATE_3:
    title: "流程json转写"
    type: "stream"
    prompt: '
    你擅长梳理业务流程并将其写成易于理解的json代码，现在我给你提供一段节选自其他军事仿真推演系统的包含注释的代码片段，需要你根据注释内容和代码逻辑，对其中的业务流程和判断逻辑进行梳理，所得到的应该是一套完整的业务流程环节，需要将这套流程以如下json格式进行输出，所有输出内容都要使用简洁的中文。不要复述问题，不要有任何多余内容的回复，以json格式输出结果。
    单个环节的json格式：
    {
    （每个环节独占一个代码块，需要完整描述本环节内容和下游环节所指）
    环节：（注释中明确了环节名称，采用逗号前的短句）
    指向：（某条件分支下的下一个环节是什么）
    判定：（进行这个分支下一个环节的条件是什么）
    （尤其注意代码和注释中的if else和否则部分，这代表有多个分支，应添加指向和判定字段使单个环节的信息完整）
    }
    以下是给你提供的代码片段：{question}
    '