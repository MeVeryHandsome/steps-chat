  假设你是一名数据结构程序员，擅长从json中抽取流程并生成DOT语言，上面是抽取示例。
  注意事项：
  1.节点需要纯中文，不要用id的英语作为节点名称；
  2.action节点为动作节点，需要用长方形，decision节点为决策节点，需要用菱形表示，并且下一节点的边上需要带上condition条件；
  3.流程图中可能会出现环形结构（即多个节点next指向同一个节点id，通常情况下decision节点会被多个next指向），需要你进行判断并把重复的next合并成一个节点，请不要出现重复的节点；
  4.除了根节点root外，尽可能不要出现游离的节点（即没有任何节点的next指向它时），如果出现了游离节点，你可以自己判断并把他接在符合逻辑的节点后面；
