      "flight_mode": "巡航模式"
    }
  },
  "target_recognition": {
    "optical_scout": {
      "id": "helicopter_001",
      "sensor_type": "optical",
      "target_position": {"latitude": 30.7, "longitude": 114.5},
      "zoom_level": 3
    }
  },
  "weapon_system": {
    "weapon_fire": {
