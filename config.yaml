# logo图片名称，需要上传至img目录
logo: "logo-xchat.png"

# 版本号
version: "Beta"

# 界面图标emoji
main_screen_icon: "chat"

# 选择模型类型(大小写均可)，支持"GLM"和"QWEN"，配置"FAKE"可用于测试
model: "glm"

# 界面标题
header: "双向认知功能演示"

# title为每个markdown框标题
# type分为stream和normal，即流式回答与非流式回答
# 占位符：{question} 表示用户输入的问题，{result1} 表示系统第一次回复的答案，{result2} 表示系统第二次回复的答案...
prompt_config:
  PROMPT_TEMPLATE_1:
    title: "场景理解"
    type: "stream"
    prompt:
      '
      你是一个军事仿真推演系统算子设计开发的专家，你对军事算子的业务执行流程和代码编写规范非常熟悉，现在我给你提供一段节选自其他军事仿真推演系统的代码片段，需要你结合通识和军事专业知识对这段代码进行阅读理解，分析这段代码中的哪些内容描述了哪个或哪些军事算子？逐个分析这些算子适用于哪个或哪些军事业务场景？最终用中文将结果总结输出即可，要求输出内容不超过50字，不要复述问题，不要有任何多余内容的回复。
      输出格式如下:
      
      ## 总结：
      
      （算子名称与适用场景）
      
      ## 描述：
      
      （代码功能概括）
      
      以下是给你提供的代码片段:{question}
      '

  PROMPT_TEMPLATE_2:
    title: "注释生成"
    type: "stream"
    prompt:
      '
      你是一个军事仿真推演系统算子设计开发的专家，你对军事算子的业务执行流程和代码编写规范非常熟悉，现在我给你提供一段节选自其他军事仿真推演系统的代码片段和其对应适用的业务场景，需要你在原代码基础上，对其中涉及业务流程和判断逻辑的内容进行注释，注释的格式为“简要的综述，加较为详细的解释描述”，请你直接输出完整的带有注释的代码，不要复述问题，不要在开头和结尾加上冗余回复，不要有任何多余内容的回复(比如“以上代码中，每个方法都有相应的注释，描述了其业务逻辑和执行流程。”）！！直接输出代码即可，只需要代码。
      场景：{result1}
      代码：{question}
      '

  PROMPT_TEMPLATE_3:
    title: "流程json转写"
    type: "stream"
    prompt: '
    你擅长梳理业务流程并将其写成易于理解的json代码，现在我给你提供一段节选自其他军事仿真推演系统的包含注释的代码片段，需要你根据注释内容和代码逻辑，对其中的业务流程和判断逻辑进行梳理，所得到的应该是一套完整的业务流程环节，需要将这套流程以如下json格式进行输出，所有输出内容都要使用简洁的中文。不要复述问题，不要有任何多余内容的回复，以json格式输出结果。
    单个环节的json格式：
    {
    （每个环节独占一个代码块，需要完整描述本环节内容和下游环节所指）
    环节：（注释中明确了环节名称，采用逗号前的短句）
    指向：（某条件分支下的下一个环节是什么）
    判定：（进行这个分支下一个环节的条件是什么）
    （尤其注意代码和注释中的if else和否则部分，这代表有多个分支，应添加指向和判定字段使单个环节的信息完整）
    }
    以下是给你提供的代码片段：{result2}
    '

show_graph:
  prompt: '
  示例：
  流程json：
  {
  "接收任务": {
    "指向": "分析目标",
    "判定": "初始化坦克后"
  },
  "分析目标": {
    "指向": "选择攻击策略",
    "判定": "确定目标类型"
  },
  "选择攻击策略": {
    "指向": "执行机动",
    "判定": "根据弹药和目标类型选择武器"
  },
  "执行机动": {
    "指向": "占领攻击位置",
    "判定": "到达目标位置"
  },
  "占领攻击位置": {
    "指向": "校准武器",
    "判定": "到达攻击位置"
  },
  "校准武器": {
    "指向": "发射武器",
    "判定": "根据使用武器类型进行校准"
  },
  "发射武器": {
    "指向": "评估打击效果",
    "判定": "准备攻击"
  },
  "评估打击效果": {
    "指向": "决定下一步行动",
    "判定": "判断目标是否被摧毁"
  },
  "决定下一步行动": {
    "指向": "结束任务",
    "判定": "根据任务成功与否及弹药情况决定"
  }
  }
  
  输出：
  digraph G {
    "接收任务" -> "分析目标" [label="初始化坦克后"]
    "分析目标" -> "选择攻击策略" [label="确定目标类型"]
    "选择攻击策略" -> "执行机动" [label="根据弹药和目标类型选择武器"]
    "执行机动" -> "占领攻击位置" [label="到达目标位置"]
    "占领攻击位置" -> "校准武器" [label="到达攻击位置"]
    "校准武器" -> "发射武器" [label="根据使用武器类型进行校准"]
    "发射武器" -> "评估打击效果" [label="准备攻击"]
    "评估打击效果" -> "决定下一步行动" [label="判断目标是否被摧毁"]
    "决定下一步行动" -> "结束任务" [label="根据任务成功与否及弹药情况决定"]

    # 定义节点样式
    "接收任务" [shape=box]
    "分析目标" [shape=box]
    "选择攻击策略" [shape=box]
    "执行机动" [shape=box]
    "占领攻击位置" [shape=box]
    "校准武器" [shape=box]
    "发射武器" [shape=box]
    "评估打击效果" [shape=box]
    "决定下一步行动" [shape=box]
    "结束任务" [shape=box]
  }
  
  假设你是一名数据结构程序员，擅长从json中抽取流程并生成digraph G语言，上面是抽取示例，现在我给你提供一段已有的流程json数据，需要你根据流程json，对其中的业务流程和判断逻辑进行梳理，需要将这套流程以如下digraph G语言格式进行输出，请你不要复述问题，不要回复除了digraph G语言之外的文字，不能有任何多余内容的回复！直接以digraph G { }包裹的形式输出结果，并且节点需要加上[shape=box]的限制。
  
  流程json：
  {result3}
  输出：
  '