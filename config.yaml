# logo图片名称，需要上传至img目录
logo: "logo-xchat.png"

# 版本号
version: "Beta"

# 界面图标emoji
main_screen_icon: "chat"

# 选择模型类型(大小写均可)，支持"GLM"和"QWEN"，配置"FAKE"可用于测试
model: "qwen"

# 界面标题
header: "双向认知功能演示"

# title为每个markdown框标题
# type分为stream和normal，即流式回答与非流式回答
# 占位符：{question} 表示用户输入的问题，{result1} 表示系统第一次回复的答案，{result2} 表示系统第二次回复的答案...
prompt_config:
  PROMPT_TEMPLATE_1:
    title: "场景理解"
    type: "stream"
    prompt:
      '
      你是一个军事仿真推演系统算子设计开发的专家，你对军事算子的业务执行流程和代码编写规范非常熟悉，现在我给你提供一段节选自其他军事仿真推演系统的代码片段，需要你结合通识和军事专业知识对这段代码进行阅读理解，分析这段代码中的哪些内容描述了哪个或哪些军事算子？逐个分析这些算子适用于哪个或哪些军事业务场景？最终用中文将结果总结输出即可，要求输出内容不超过50字，不要复述问题，不要有任何多余内容的回复。
      输出格式如下:
      
      ## 描述：

      （代码功能概括）
      
      ## 总结：
      
      （算子名称与适用场景）
      
      以下是给你提供的代码片段:{question}
      '

  PROMPT_TEMPLATE_2:
    title: "注释生成"
    type: "stream"
    prompt:
      '
      你是一个军事仿真推演系统算子设计开发的专家，你对军事算子的业务执行流程和代码编写规范非常熟悉。
      现在我给你提供一段节选自其他军事仿真推演系统的代码片段和其对应适用的业务场景，需要你在原代码基础上，对其中涉及业务流程和判断逻辑的内容进行注释。
      注释的格式为“简要的综述，加较为详细的解释描述”。
      请你直接输出完整的带有注释的代码，不要复述问题，不要在开头和结尾加上冗余回复，
      不要在结尾有任何多余内容的回复！！直接输出代码+注释即可。
      场景：{result1}
      代码：{question}
      '

  PROMPT_TEMPLATE_3:
    title: "流程json转写"
    type: "stream"
    prompt: '
    代码示例：
    class FighterJet:
        def __init__(self, id, position):
            self.id = id  # 战斗机的唯一标识符
            self.position = position  # 战斗机当前位置
            self.weapon_loadout = {"missiles": 2, "cannon": 100}  # 武器配置
    
        def receive_mission(self, target):
            self.target = target  # 接受目标信息
    
        def choose_attack_strategy(self):
            if self.weapon_loadout["missiles"] > 0:
                self.weapon_to_use = "missile"  # 使用导弹
            else:
                self.weapon_to_use = "cannon"  # 使用大炮
    
        def execute_attack(self):
            if self.weapon_to_use == "missile":
                self.weapon_loadout["missiles"] -= 1  # 发射导弹
                return "missile_fired"
            else:
                self.weapon_loadout["cannon"] -= 10  # 发射大炮
                return "cannon_fired"
    
    # 示例任务执行过程：
    jet = FighterJet("FJ001", [0, 0])  # 初始化战斗机
    jet.receive_mission({"position": [100, 200], "type": "ground"})  # 接受任务
    jet.choose_attack_strategy()  # 选择攻击策略
    result = jet.execute_attack()  # 执行攻击

    json输出：
    {
      "id": "start_mission",
      "type": "action",
      "description": "接收任务并获取目标信息。",
      "next": "choose_attack_strategy"
    },
    {
      "id": "choose_attack_strategy",
      "type": "decision",
      "description": "根据武器负载选择攻击策略。",
      "next": [
        {
          "condition": "导弹可用",
          "id": "use_missile"
        },
        {
          "condition": "导弹不可用",
          "id": "use_cannon"
        }
      ]
    },
    {
      "id": "use_missile",
      "type": "action",
      "description": "发射导弹攻击目标。",
      "next": "attack_result"
    },
    {
      "id": "use_cannon",
      "type": "action",
      "description": "使用大炮攻击目标。",
      "next": "attack_result"
    },
    {
      "id": "attack_result",
      "type": "decision",
      "description": "评估攻击效果，是否继续任务？",
      "next": [
        {
          "condition": "继续任务",
          "id": "choose_attack_strategy"
        },
        {
          "condition": "结束任务",
          "id": "end_mission"
        }
      ]
    },
    {
      "id": "end_mission",
      "type": "action",
      "description": "任务结束，返回基地。",
      "next": "start_mission"
    }

    假设你是精通军事业务的程序员，请你根据用户提供的代码，生成决策树的 JSON 结构。
    每个节点对象应包括 id字段, type字段, description字段、以及next数组，
    id是当前节点的唯一标识；
    type是当前节点的类型，包含两种类型：decision、action，decision表示决策节点，action表示行动节点；
    description是当前节点的描述；
    next是指向下一节点的ID列表，对于行动节点，next映射出后续节点的id；
    对于决策节点，next映射出基于不同条件的不同路径。
    请你确保 JSON 结构清晰、逻辑性强，并且不要在开头和结尾加上冗余回复，直接输出json即可。
    以下是给你提供的代码片段：{result2}
    json输出：
    '


