    }
  }
}]```
    示例2：
    用户请求：直升机控制飞行姿态，调整高度与速度，并且在飞行过程中切换武器类型，从机枪切换为导弹准备打击空中目标。
    调度结果：```json
  [{
    "system": "飞行控制系统",
