# logo图片名称，需要上传至img目录
logo: "logo-xchat.png"

# 版本号
version: "Beta"

# 界面图标emoji
main_screen_icon: "chat"

# 选择模型类型(大小写均可)，支持"GLM"和"QWEN"，配置"FAKE"可用于测试
model: "deepseek"

# 界面标题
header: "仿真系统指令调度"

# 占位符：{question} 表示用户输入的问题，{result1} 表示系统第一次回复的答案，{result2} 表示系统第二次回复的答案...
prompts:
  PROMPT_TEMPLATE_1:
    title: "调度指令生成"
    prompt: '
    我们正在进行一场仿真演练，我方为红方，敌方为蓝方。
    假设你是后端程序员，请你严格按照接口调度的json字段描述，根据识别的决策逻辑和参数设定，生成接口调度的 JSON 结构。
    该json结构应包含以下字段：
    {
      "指令序列": List[Dict["步骤":String, "调度数据": List[Dict]]
    }
    请根据实际情况进行填充。
    
    示例1
    指挥员指令：
    选取一架歼15战斗机，编号002，立即从辽宁号航母001起飞，进行高速前行，保障辽宁号的安全，并执行区域侦察任务。需要调整飞行参数以应对可能的恶劣天气。
    
    核心决策：
    1. 紧急起飞：命令歼15机号002从辽宁号航母001上紧急起飞。 
    2. 航线调整以避开恶劣天气：鉴于预测的恶劣天气，指令飞机调整航向，提升飞行高度，以确保安全。 
    3. 执行S型侦察巡逻：完成调整后，执行S型侦察巡逻，全面监视辽宁号周边的空域情况，确保无任何威胁接近。
    
    参数设定与解释：
    ### （1）起飞
    + 指令："起飞",
    + 指令解释: "执行起飞指令",
    + 兵力名称: "歼15战斗机002"
    + 兵力名称解释: "决策选取歼15战斗机002战斗机",
    + 速度: 300.0,
    + 速度解释: "300公里/小时是假设歼15战斗机的最大允许起飞速度。在实际操作中，起飞速度会根据飞机的重量、气象条件以及跑道的长度等因素来确定。这里我们选择一个合理的速度来保证飞机能够安全起飞。"
    + 航向: 30.0,
    + 速度解释: "起飞航向通常会考虑航母的航向以及风向。航母的航向加上30度可以确保飞机在起飞后能够迅速转向到预定巡逻航线。",
    + 高度: 5000.0,
    + 高度解释: "选择5000米作为起飞高度是为了确保飞机能够避开恶劣天气，如雷暴或浓厚的云层。这个高度也足够飞机进行安全爬升到更高的巡航高度。",
    + 载体名称: "辽宁号航母001",
    + 载体名称解释: "这是起飞地点的标识，指明歼15战斗机是从辽宁号航母上起飞的。"
    ### （2）机动控制参数
    + 指令："机动控制",
    + 指令解释: "执行机动控制指令",
    + 兵力名称: "歼15战斗机002"
    + 兵力名称解释: "歼15战斗机002战斗机进行机动",
    + 速度: 600.0,
    + 速度解释: "600公里/小时这个速度是飞机在完成起飞后的巡航速度，600公里/小时是一个相对较高的速度，可以保证飞机快速到达巡逻区域并完成任务。"
    + 航向: 20.0,
    + 航向解释: "这个调整是为了避开预测的恶劣天气区域。通过改变航向，飞机可以绕过不利气象条件，确保飞行的安全。"
    + 高度: 8000.0,
    + 高度解释: "提升至8000米的高度可以确保飞机远离地面障碍物和大部分恶劣天气，同时这个高度对于大多数战斗机来说是经济的巡航高度。"
    ### （3）巡逻参数
    + 指令："巡逻",
    + 指令解释: "执行巡逻指令",
    + 兵力名称: "歼15战斗机002",
    + 兵力名称解释: "执行巡逻单位为歼15战斗机002",
    + 巡逻方式: "S型",
    + 巡逻方式解释": "S型巡逻是一种常见的巡逻模式，它允许飞机在巡逻区域内以曲线航线飞行，这样可以更好地覆盖监视区域，并提高发现潜在威胁的可能性。"
    
    调度代码：
    ```json
    {
      "指令序列": [
        {
          "步骤": "紧急起飞",
          "调度数据":  [{
            "指令": "起飞",
            "兵力名称": "歼15机号002",
            "速度": 300.0,
            "航向": 30.0,
            "高度": 5000.0,
            "载体名称": "辽宁号航母001"
          }]
        },
        {
          "步骤": "航线调整以避开恶劣天气",
          "调度数据": [{
            "指令": "机动控制",
            "兵力名称": "歼15机号002",
            "速度": 600.0,
            "航向": 20.0,
            "高度": 8000.0
          }]
        },
        {
          "步骤": "执行S型侦察巡逻",
          "调度数据": [{
            "指令": "巡逻",
            "兵力名称": "歼15机号002",
            "巡逻方式": "S型"
          }]
        }
      ]
    }
    ```
    
    示例2
    指挥员指令：
    即刻调动两架歼15战斗机，编号004和005，从辽宁号航母001起飞，执行紧急救援任务。飞行编队调整，同时执行全方位搜索。
    
    核心决策：
    1. 同时起飞：歼15机号004和005从辽宁号航母001同时起飞，确保协同操作。
    2. 飞行编队调整：调整编队飞行，机号004提升速度和高度，机号005相对减速和降低高度，确保全方位覆盖。
    3. 全方位搜索：执行全方位搜索，同时监视大区域以定位紧急情况。
    
    参数设定与解释：
    ### （1）起飞
    + 指令: "起飞",
    + 指令解释: "执行起飞指令",
    + 兵力名称: "歼15战斗机004、歼15战斗机005",
    + 兵力名称解释: "决策选取歼15战斗机004和歼15战斗机005同时起飞，确保协同操作",
    + 速度: 300.0,
    + 速度解释: "300公里/小时是假设歼15战斗机的最大允许起飞速度。在实际操作中，起飞速度会根据飞机的重量、气象条件以及跑道的长度等因素来确定。这里我们选择一个合理的速度来保证飞机能够安全起飞。",
    + 航向: 30.0,
    + 航向解释: "起飞航向通常会考虑航母的航向以及风向。航母的航向加上30度可以确保飞机在起飞后能够迅速转向到预定搜索航线。",
    + 高度: 5000.0,
    + 高度解释: "选择5000米作为起飞高度是为了确保飞机能够避开恶劣天气，如雷暴或浓厚的云层。这个高度也足够飞机进行安全爬升到更高的巡航高度。",
    + 载体名称: "辽宁号航母001",
    + 载体名称解释: "这是起飞地点的标识，指明歼15战斗机是从辽宁号航母上起飞的。"
    ### （2）机动控制
    + 指令: "机动控制",
    + 指令解释: "执行机动控制指令",
    + 兵力名称: "歼15战斗机004",
    + 兵力名称解释: "决策选取歼15战斗机004执行高速前行，保障辽宁号的安全",
    + 速度: 600.0,
    + 速度解释: "600公里/小时这个速度是飞机在完成起飞后的巡航速度，600公里/小时是一个相对较高的速度，可以保证飞机快速到达巡逻区域并完成任务。",
    + 航向: 30.0,
    + 航向解释: "这个航向是为了避开预测的恶劣天气区域。通过改变航向，飞机可以绕过不利气象条件，确保飞行的安全。",
    + 高度: 8000.0,
    + 高度解释: "提升至8000米的高度可以确保飞机远离地面障碍物和大部分恶劣天气，同时这个高度对于大多数战斗机来说是经济的巡航高度。"
    ### （3）机动控制
    + 指令: "机动控制",
    + 指令解释: "执行机动控制指令",
    + 兵力名称: "歼15战斗机005",
    + 兵力名称解释: "决策选取歼15战斗机005相对减速和降低高度，确保全方位覆盖。",
    + 速度: 500.0,
    + 速度解释: "500公里/小时这个较低的速度是为了让005号机在较低的高度上能够更好地执行搜索任务，同时与004号机形成垂直梯队。",
    + 航向: 30.0,
    + 航向解释: "与004机保持相对位置，005号机的航向将会与004号机保持相对位置，以便两架飞机能够协同搜索，形成全方位覆盖。",
    + 高度: 6000.0,
    + 高度解释: "选择6000米的高度是为了让005号机能够在较低的高度上进行更细致的搜索，同时这个高度也足够安全，可以避免地面障碍物。"
    ### （4）搜索
    + 指令: "搜索",
    + 指令解释: "执行搜索指令",
    + 兵力名称: "歼15战斗机004、歼15战斗机005",
    + 兵力名称解释: "执行搜索单位为歼15战斗机004和歼15战斗机005，同时执行全方位搜索。",
    + 搜索方式: "全方位搜索",
    + 搜索方式解释: "全方位搜索是一种常见的搜索模式，它允许飞机在搜索区域内以全覆盖航线飞行，这样可以更好地覆盖监视区域，并提高发现潜在威胁的可能性。"
    
    调度代码：
    ```json
