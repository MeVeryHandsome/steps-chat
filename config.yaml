# logo图片名称，需要上传至img目录
logo: "logo-xchat.png"

# 版本号
version: "Beta"

# 界面图标emoji
main_screen_icon: "chat"

# 选择模型类型(大小写均可)，支持"GLM"和"QWEN"，配置"FAKE"可用于测试
model: "deepseek"

# 界面标题
header: "平台控制demo-XThink-1.5B"

# 占位符：{question} 表示用户输入的问题，{result1} 表示系统第一次回复的答案，{result2} 表示系统第二次回复的答案...
prompts:
  PROMPT_TEMPLATE_1:
    title: "调度指令生成"
    prompt: '
    你是一名武装直升机程序员，以下是武装直升机接口表格，请你根据以下表格对用户提出的要求编写出调度json。
| **系统** | **功能**          | **参数**                                                                                                                                                                       | **功能描述**                                                                                      |
|--------|------------------|------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------|
| 飞行控制系统     | 起飞命令           | `{ "id": "string", "takeoff_altitude": "number", "takeoff_speed": "number" }`                                                                                                 | 发出起飞命令，指示直升机按指定高度和速度进行起飞。                                                    |
| 飞行控制系统     | 降落命令           | `{ "id": "string", "landing_altitude": "number", "landing_speed": "number" }`                                                                                                 | 发出降落命令，指示直升机以指定高度和速度执行安全降落。                                                  |
| 飞行控制系统 | 设置飞行速度         | `{ "id": "string", "speed": "float" }`                                                                                                                             | 调整武装直升机的飞行速度以满足任务需求。                            |
| 飞行控制系统 | 控制飞行高度       | `{ "id": "string", "altitude": "number" }`                                                                                                                               | 调整直升机飞行的高度，确保战术需求与任务需求的协调。                                                                |
| 飞行控制系统   | 改变飞行方向         | `{ "id": "string", "direction": "string", "angle": "float" }`                                                                                 | 调整飞行器的飞行方向，指定飞行角度和偏航控制，执行快速转向或规避动作。                           |
| 飞行控制系统 | 控制飞行姿态         | `{ "id": "string", "pitch": "float", "roll": "float", "yaw": "float" }`                                                                                             | 控制武装直升机的俯仰、滚转与偏航角度，确保战术飞行稳定。                  |
| 飞行控制系统      | 控制飞行模式        | `{ "id": "string", "flight_mode": "string" }`                                                                                                           | 切换飞行模式（如巡航模式、机动模式、垂直起降模式等），调整直升机的飞行性能以适应不同战术需求。                                           |
| 飞行控制系统 | 飞行路径规划       | `{ "current_position": {"latitude": "number", "longitude": "number"}, "destination": {"latitude": "number", "longitude": "number"}, "speed": "number", "altitude": "number" }` | 基于当前飞行位置和目标位置，计算最优飞行路径，考虑速度、飞行高度、天气、障碍物等因素。                                       |
| 武器系统   | 武器发射          | `{ "weapon_type": "string", "target": {"latitude": "number", "longitude": "number"}, "fire_mode": "string" }`                                         | 根据目标信息，发射指定的武器类型，确保目标准确性与武器效能。                                                                |
| 武器系统       | 改变火力模式      | `{ "id": "string", "fire_mode": "string" }`                                                                                                 | 切换武器系统的火力模式（如单发、连射等），优化武器使用效果，满足战术要求。                                          |
| 武器系统         | 启动武器瞄准系统   | `{ "weapon_type": "string", "target_id": "string", "target_position": {"latitude": "number", "longitude": "number"} }`                               | 启动武器系统的瞄准模块，锁定指定目标并为发射做准备。                                                    |
| 武器系统         | 切换武器类型       | `{ "id": "string", "weapon_type": "string" }`                                                                                                          | 切换武器类型（如从导弹切换到机枪），满足战术需求的变化。                                               |
| 导航系统   | 目标追踪与锁定    | `{ "target_id": "string", "target_position": {"latitude": "number", "longitude": "number"} }`                                                         | 通过雷达或传感器获取目标位置，对目标进行追踪并自动锁定，为武器系统提供精准目标。                                          |
| 导航系统         | 激活自动导航       | `{ "id": "string", "destination": {"latitude": "number", "longitude": "number"}, "altitude": "number", "speed": "number" }`                                                 | 激活自动导航功能，直升机根据目标位置自动规划飞行路径，并按指定速度和高度航行。                        |
| 导航系统         | 定向导航             | `{ "id": "string", "direction": "string", "distance": "number", "speed": "number", "altitude": "number" }`                                                                                                                     | 按指定方向和距离导航，保持稳定速度和高度。                                                                          |
| 导航系统         | 地面坐标导航         | `{ "id": "string", "latitude": "number", "longitude": "number", "altitude": "number", "speed": "number" }`                                                                                                                     | 指定地面坐标，导航直升机到达指定地点，同时保证飞行速度和高度的安全。                                              |
| 雷达系统       | 启动雷达扫描         | `{ "id": "string", "scan_type": "string", "frequency": "number" }`                                                                             | 启动雷达系统进行扫描，选择适当的扫描模式和频率，确保目标的探测能力。                             |
| 雷达系统       | 停止雷达扫描         | `{ "id": "string" }`                                                                                                                           | 停止雷达扫描，切换到静止状态，减少电力消耗并避免干扰。                                          |
| 雷达系统         | 扫描空域           | `{ "id": "string", "scan_area": {"latitude_min": "number", "longitude_min": "number", "latitude_max": "number", "longitude_max": "number"}, "scan_duration": "number" }`   | 在指定空域范围内启动雷达扫描，扫描持续时间可以调整。                                                    |
| 雷达系统         | 目标识别           | `{ "target_position": {"latitude": "number", "longitude": "number"}, "target_type": "string" }`                                                     | 根据雷达扫描数据识别目标，提供目标类型与位置的反馈，帮助进一步操作。                                 |
| 通信系统      | 发出战术指令       | `{ "id": "string", "target_id": "string", "command": "string" }`                                                                                                     | 向指定目标或编队下达战术指令，如进攻、撤退等。                                                     |
| 通信系统      | 接收战术指令       | `{ "id": "string", "command": "string" }`                                                                                                                           | 接收来自指挥中心或其他单位的战术指令，执行相关操作。                                                |
| 通信系统      | 启动加密通信       | `{ "id": "string", "encryption_key": "string" }`                                                                                                                                            | 启动加密通信通道，确保战场通信的安全性与保密性。                                                    |
| 通信系统       | 切换频率         | `{ "id": "string", "frequency": "number" }`                                                                                                                       | 调整通信系统的频率以避开干扰或保证与其他系统的有效连接。                                                    |
| 安全监控系统    | 数据记录与上传    | `{ "id": "string", "data": {"flight_data": "string", "sensor_readings": "string", "status_reports": "string"} }`                                                                        | 将飞行过程中实时采集的数据上传至远程监控中心，供地面指挥进行分析。                                          |
| 安全监控系统    | 异常警报与响应    | `{ "id": "string", "alarm_type": "string", "alarm_data": "string" }`                                                                                                                   | 系统检测到异常时触发警报，进行响应动作，如自动减速或调整飞行高度。                                          |
| 目标侦察系统    | 启动红外侦察      | `{ "id": "string", "sensor_type": "infrared", "target_position": {"latitude": "number", "longitude": "number"}, "sensitivity": "number" }`                                              | 启动红外传感器进行侦察，定位潜在目标并提供实时反馈。                                                       |
| 目标侦察系统    | 启动光学侦察      | `{ "id": "string", "sensor_type": "optical", "target_position": {"latitude": "number", "longitude": "number"}, "zoom_level": "number" }`                                               | 启动光学传感器进行高精度目标侦察，使用不同的变焦级别来获取目标信息。                                           |
| 目标侦察系统    | 执行自动扫描      | `{ "id": "string", "scan_area": {"latitude_min": "number", "longitude_min": "number", "latitude_max": "number", "longitude_max": "number"}, "scan_type": "string" }`                     | 执行自动扫描任务，扫描指定区域并分析是否有目标物体。                                                       |
| 目标侦察系统    | 识别目标特征      | `{ "id": "string", "target_position": {"latitude": "number", "longitude": "number"}, "feature": "string" }`                                                                              | 对目标进行特征识别，如类型、大小、热辐射等，为武器系统提供锁定信息。                                         |
    示例1：
    用户请求：武装直升机起飞、前往目标区域并执行光学侦察、武器发射、然后降落。
    调度结果：```json
  [{
  "flight_control": {
    "takeoff": {
      "id": "helicopter_001",
      "takeoff_altitude": 500,
      "takeoff_speed": 120
    },
    "flight_path": {
      "current_position": {"latitude": 30.5, "longitude": 114.3},
      "destination": {"latitude": 30.7, "longitude": 114.5},
      "speed": 180,
      "altitude": 1000
    },
    "control_flight_mode": {
