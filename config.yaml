# logo图片名称，需要上传至img目录
logo: "logo-xchat.png"

# 版本号
version: "Beta"

# 界面图标emoji
main_screen_icon: "chat"

# 选择模型类型(大小写均可)，支持"GLM"和"QWEN"，配置"FAKE"可用于测试
model: "qwen"

# 界面标题
header: "仿真系统指令调度"

# 占位符：{question} 表示用户输入的问题，{result1} 表示系统第一次回复的答案，{result2} 表示系统第二次回复的答案...
prompts:
  PROMPT_TEMPLATE_1:
    title: "调度指令生成"
    prompt: '
# 1. 空调
| 系统   | 模块      | 参数                                                | 功能       | 功能描述                                  |
|--------|-----------|-----------------------------------------------------|------------|-------------------------------------------|
| 空调   | 开关控制  | `{"power": "boolean"}`                               | 开启/关闭空调 | 控制空调的开关状态                        |
| 空调   | 温度设置  | `{"temperature": {"type": "integer", "minimum": 16, "maximum": 30}}` | 设置空调温度 | 设置空调的工作温度范围为16到30摄氏度      |
| 空调   | 风速控制  | `{"fan_speed": {"type": "string", "enum": ["low", "medium", "high"]}}` | 设置风速   | 设置空调的风速为低、中、高档             |
| 空调   | 模式切换  | `{"mode": {"type": "string", "enum": ["cool", "heat", "dry", "auto"]}}` | 切换工作模式 | 切换空调的工作模式（制冷、制热、除湿、自动） |
| 空调   | 定时控制  | `{"timer": {"type": "integer", "minimum": 1, "maximum": 240}}` | 设置定时   | 设置空调定时关闭，最大240分钟            |

# 2. 电视
| 系统   | 模块      | 参数                                                | 功能       | 功能描述                                  |
|--------|-----------|-----------------------------------------------------|------------|-------------------------------------------|
| 电视   | 开关控制  | `{"power": "boolean"}`                               | 开启/关闭电视 | 控制电视的开关状态                        |
| 电视   | 音量调节  | `{"volume": {"type": "integer", "minimum": 0, "maximum": 100}}` | 设置音量   | 调节电视的音量大小，范围从0到100          |
| 电视   | 频道切换  | `{"channel": {"type": "integer", "minimum": 1}}`      | 切换频道   | 切换电视的频道，参数为频道编号            |
| 电视   | 源切换    | `{"source": {"type": "string", "enum": ["HDMI1", "HDMI2", "AV", "TV"]}}` | 切换输入源 | 切换电视的输入源（如HDMI、AV、电视等）     |
| 电视   | 显示设置  | `{"brightness": {"type": "integer", "minimum": 0, "maximum": 100}, "contrast": {"type": "integer", "minimum": 0, "maximum": 100}}` | 调节亮度对比度 | 调节电视的亮度和对比度设置                |

# 3. 热水器
| 系统   | 模块      | 参数                                                | 功能       | 功能描述                                  |
|--------|-----------|-----------------------------------------------------|------------|-------------------------------------------|
| 热水器 | 开关控制  | `{"power": "boolean"}`                               | 开启/关闭热水器 | 控制热水器的开关状态                      |
| 热水器 | 温度设置  | `{"temperature": {"type": "integer", "minimum": 30, "maximum": 80}}` | 设置温度   | 设置热水器的温度范围为30到80摄氏度         |
| 热水器 | 定时控制  | `{"timer": {"type": "integer", "minimum": 0, "maximum": 120}}` | 设置定时   | 设置热水器定时工作，单位为分钟，最大120分钟 |
| 热水器 | 模式切换  | `{"mode": {"type": "string", "enum": ["normal", "quick", "eco"]}}` | 切换模式   | 切换热水器的工作模式（普通、快速、节能）   |

# 4. 冰箱
| 系统   | 模块      | 参数                                                | 功能       | 功能描述                                  |
|--------|-----------|-----------------------------------------------------|------------|-------------------------------------------|
| 冰箱   | 开关控制  | `{"power": "boolean"}`                               | 开启/关闭冰箱 | 控制冰箱的开关状态                        |
| 冰箱   | 温控设置  | `{"temperature": {"type": "integer", "minimum": -18, "maximum": 8}}` | 设置温度   | 设置冰箱的温度范围从-18到8摄氏度          |
| 冰箱   | 模式切换  | `{"mode": {"type": "string", "enum": ["freezer", "fridge", "eco"]}}` | 切换工作模式 | 切换冰箱的工作模式（冷冻、冷藏、节能）     |
| 冰箱   | 制冰控制  | `{"ice_maker": "boolean"}`                            | 开启/关闭制冰 | 控制冰箱制冰功能的开关                    |

# 5. 灯光
| 系统   | 模块      | 参数                                                | 功能       | 功能描述                                  |
|--------|-----------|-----------------------------------------------------|------------|-------------------------------------------|
| 灯光   | 开关控制  | `{"power": "boolean"}`                               | 开启/关闭灯光 | 控制灯光的开关状态                        |
| 灯光   | 亮度调节  | `{"brightness": {"type": "integer", "minimum": 0, "maximum": 100}}` | 调节亮度   | 调节灯光的亮度大小，范围从0到100          |
| 灯光   | 色温调节  | `{"color_temperature": {"type": "integer", "minimum": 2000, "maximum": 6500}}` | 设置色温   | 设置灯光的色温，范围从2000到6500K         |
| 灯光   | 模式切换  | `{"mode": {"type": "string", "enum": ["warm", "cool", "natural"]}}` | 切换光模式 | 切换灯光的光模式（温暖、冷光、自然光）    |
| 灯光   | 定时控制  | `{"timer": {"type": "integer", "minimum": 1, "maximum": 240}}` | 设置定时   | 设置灯光定时关闭，最大240分钟            |

# 6. 音响
| 系统   | 模块      | 参数                                                | 功能       | 功能描述                                  |
|--------|-----------|-----------------------------------------------------|------------|-------------------------------------------|
| 音响   | 开关控制  | `{"power": "boolean"}`                               | 开启/关闭音响 | 控制音响的开关状态                        |
| 音响   | 音量调节  | `{"volume": {"type": "integer", "minimum": 0, "maximum": 100}}` | 调节音量   | 调节音响的音量大小，范围从0到100          |
| 音响   | 音效设置  | `{"sound_mode": {"type": "string", "enum": ["stereo", "surround", "bass"]}}` | 设置音效模式 | 设置音响的音效模式（立体声、环绕声、低音） |
| 音响   | 蓝牙连接  | `{"bluetooth": {"type": "boolean"}}`                 | 启用/禁用蓝牙 | 启动或关闭音响的蓝牙功能                  |
| 音响   | 声道切换  | `{"channel": {"type": "string", "enum": ["left", "right", "center"]}}` | 切换声道   | 切换音响的声道（左、右、中）              |

# 7. 洗衣机
| 系统   | 模块      | 参数                                                | 功能       | 功能描述                                  |
|--------|-----------|-----------------------------------------------------|------------|-------------------------------------------|
| 洗衣机 | 开关控制  | `{"power": "boolean"}`                               | 开启/关闭洗衣机 | 控制洗衣机的开关状态                      |
| 洗衣机 | 水温调节  | `{"temperature": {"type": "integer", "minimum": 20, "maximum": 90}}` | 设置水温   | 设置洗衣机的水温范围从20到90摄氏度        |
| 洗衣机 | 洗涤模式  | `{"mode": {"type": "string", "enum": ["normal", "delicate", "quick"]}}` | 设置洗涤模式 | 设置洗衣机的洗涤模式（普通、精致、快速）   |
| 洗衣机 | 转速调节  | `{"spin_speed": {"type": "integer", "minimum": 600, "maximum": 1600}}` | 设置转速   | 设置洗衣机的转速范围从600到1600转/分钟    |
| 洗衣机 | 定时控制  | `{"timer": {"type": "integer", "minimum": 1, "maximum": 240}}` | 设置定时   | 设置洗衣机的定时功能，最大240分钟         |

# 8. 扫地机
| 系统   | 模块      | 参数                                                | 功能       | 功能描述                                  |
|--------|-----------|-----------------------------------------------------|------------|-------------------------------------------|
| 扫地机 | 开关控制  | `{"power": "boolean"}`                               | 开启/关闭扫地机 | 控制扫地机的开关状态                      |
| 扫地机 | 清扫模式  | `{"mode": {"type": "string", "enum": ["auto", "edge", "spot"]}}` | 设置清扫模式 | 设置扫地机的清扫模式（自动、边缘、局部清扫）|
| 扫地机 | 启动定时  | `{"timer": {"type": "integer", "minimum": 1, "maximum": 180}}` | 设置定时    | 设置扫地机工作时长，单位为分钟（1至180分钟）|
| 扫地机 | 强力清扫  | `{"power_mode": {"type": "boolean"}}`                | 启动强力清扫 | 启动或关闭扫地机的强力清扫模式            |
| 扫地机 | 清扫路径  | `{"path": {"type": "string", "enum": ["zigzag", "random", "linear"]}}` | 设置清扫路径 | 设置扫地机的清扫路径（之字形、随机、线性）|
     假设你是智能家居调度程序员，当用户输入行为后，你需要根据实际情况为他生成调度指令json。
     当前为示例1，仅供参考：
     用户行为：开启音响，并将音量调节为30，适合背景音。
     调度指令：```json
     [{
     "system": "音响",
     "module": "开关控制",
     "parameters": {
       "power": true
     }
   },
   {
     "system": "音响",
     "module": "音量调节",
     "parameters": {
       "volume": 30
     }
   }]```
     当前为示例2，仅供参考：
     用户行为：开启灯光，调节亮度为70，并设置色温为4000K（自然光），光模式为自然光。
     调度指令：```json
     [{
     "system": "灯光",
     "module": "开关控制",
     "parameters": {
       "power": true
     }
   },
   {
     "system": "灯光",
     "module": "亮度调节",
     "parameters": {
       "brightness": 70
     }
   },
   {
     "system": "灯光",
     "module": "色温调节",
     "parameters": {
       "color_temperature": 4000
     }
   },
   {
     "system": "灯光",
     "module": "模式切换",
     "parameters": {
       "mode": "natural"
     }
   }]```
  上面是参考内容，请你根据以下用户行为完成调度指令！
  用户行为：{question}
  调度指令：'